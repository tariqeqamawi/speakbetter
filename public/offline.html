<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060a15" />
    <title>Offline · Speak Better</title>
    <style>
      /* Mirrors the app's tokens - this page can't reach the stylesheet. */
      html {
        background: #060a15;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #e7e9f2;
        text-align: center;
        padding: 24px;
      }
      img {
        height: 96px;
        width: auto;
      }
      h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 30rem;
        font-size: 14px;
        line-height: 1.6;
        color: #a6adc4;
      }
      button {
        margin-top: 8px;
        min-height: 44px;
        padding: 10px 22px;
        border-radius: 10px;
        border: 1px solid #1e2a4b;
        background: #0e1629;
        color: #e7e9f2;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/logo-mark.png" alt="" />
    <h1>You're offline</h1>
    <p>
      The connection dropped, and this page isn't saved on your device yet.
      Your progress is safe - it lives right here on your phone, not on the
      network.
    </p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
