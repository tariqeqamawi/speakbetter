<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Post 4 (black)</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070b18;color:#EEF0F7;font:16px/1.5 system-ui,-apple-system,sans-serif}

<script>const c=document.getElementById("c"),d=[...document.querySelectorAll("#d i")],p=document.getElementById("prev"),x=document.getElementById("next"),n=document.getElementById("n");
const at=()=>Math.round(c.scrollLeft/c.clientWidth),go=i=>c.scrollTo({left:Math.max(0,Math.min(d.length-1,i))*c.clientWidth,behavior:"smooth"});
const u=()=>{const i=at();d.forEach((e,k)=>e.classList.toggle("on",k===i));p.disabled=i===0;x.disabled=i===d.length-1;n.textContent=(i+1)+" / "+d.length};
c.addEventListener("scroll",u,{passive:true});p.onclick=()=>go(at()-1);x.onclick=()=>go(at()+1);d.forEach((e,k)=>e.onclick=()=>go(k));
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(at()-1);if(e.key==="ArrowRight")go(at()+1)});u();</script></body></html>
