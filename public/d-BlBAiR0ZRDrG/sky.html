<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Sky Dome Preview</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#EEF0F7;font:15px/1.4 system-ui,-apple-system,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.ui{position:fixed;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 16px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:linear-gradient(#000c,#0000)}
.ui a{color:#22D9F5;text-decoration:none;font-size:13px;margin-right:6px}
.pill{border:1px solid #2a3355;background:#0b1224cc;color:#B9C0D8;border-radius:999px;padding:7px 14px;font:600 13px system-ui;cursor:pointer}
.pill.on{border-color:#22D9F5;color:#fff;box-shadow:0 0 12px -2px #22D9F5}
.hint{position:fixed;left:0;right:0;bottom:0;padding:12px 16px max(14px,env(safe-area-inset-bottom));text-align:center;font-size:12px;color:#8790AB;background:linear-gradient(#0000,#000c);text-wrap:balance}
</style></head><body>
<div class="ui"><a href="index.html">&lsaquo; All</a>
<button class="pill on" data-k="a">Sky A</button><button class="pill" data-k="b">Sky B</button>
<button class="pill" id="up">Look up</button><button class="pill" id="ahead">Look ahead</button></div>
<canvas id="c"></canvas>
<div class="hint">Drag to look around - all the way up, to check nothing is cut off. The dark band at the bottom stands in for the land.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,1,0.1,2000);
const loader=new THREE.TextureLoader();
const tex={};
function load(k){if(!tex[k]){tex[k]=loader.load("sky/"+k+".webp");tex[k].encoding=THREE.sRGBEncoding;tex[k].anisotropy=8}return tex[k]}
// The sky: the panorama wrapped round the inside of a sphere, as on the road.
const dome=new THREE.Mesh(new THREE.SphereGeometry(1000,96,48),new THREE.MeshBasicMaterial({map:load("a"),side:THREE.BackSide}));
scene.add(dome);
// The land, a dark disc at the horizon with a faint grid - only for scale.
const land=new THREE.Mesh(new THREE.CircleGeometry(900,64),new THREE.MeshBasicMaterial({color:0x020409}));
land.rotation.x=-Math.PI/2;land.position.y=-6;scene.add(land);
const grid=new THREE.GridHelper(900,90,0x0e5a66,0x0a2a33);grid.position.y=-5.9;scene.add(grid);
renderer.outputEncoding=THREE.sRGBEncoding;
let yaw=0,pitch=0.12,ty=yaw,tp=pitch,drag=null;
canvas.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{if(!drag)return;ty-= (e.clientX-drag.x)*0.005;tp+=(e.clientY-drag.y)*0.005;tp=Math.max(-0.3,Math.min(1.5,tp));drag={x:e.clientX,y:e.clientY}});
canvas.addEventListener("pointerup",()=>drag=null);
document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{dome.material.map=load(b.dataset.k);dome.material.needsUpdate=true;document.querySelectorAll("[data-k]").forEach(x=>x.classList.toggle("on",x===b))});
document.getElementById("up").onclick=()=>tp=1.45;
document.getElementById("ahead").onclick=()=>tp=0.12;
function size(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener("resize",size);size();
(function tick(){requestAnimationFrame(tick);if(!drag)ty+=0.0006;yaw+=(ty-yaw)*0.12;pitch+=(tp-pitch)*0.12;
camera.rotation.order="YXZ";camera.rotation.y=yaw;camera.rotation.x=pitch;renderer.render(scene,camera)})();
</script></body></html>
